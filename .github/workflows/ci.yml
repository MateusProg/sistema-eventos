name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Testes e Artefato
    runs-on: ubuntu-latest

    steps:
      - name: Obtenção do código-fonte (Checkout)
        uses: actions/checkout@v4