name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtenção do código-fonte (checkout)
      - name: 1. Obtenção do código-fonte (Checkout)
        uses: actions/checkout@v4

      # 2. Preparação do ambiente e instalação das dependências
      - name: 2.1 Configurar ambiente Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 2.2 Baixar e resolver dependências
        run: mvn dependency:go-offline -B

      # 3. Compilação ou validação da aplicação
      - name: 3. Validar e compilar a aplicação
        run: mvn test-compile -B

      # 4. Execução de testes automatizados
      - name: 4.1 Executar testes unitários (JUnit)
        run: mvn test -B

      - name: 4.2 Publicar relatório visual dos testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Relatório JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # 5. Geração do artefato de software (Imagem Docker)
      - name: 5.1 Empacotar aplicação (.jar) para o container
        run: mvn package -DskipTests -B

      - name: 5.2 Construir imagem Docker e exportar como arquivo
        run: |
          docker build -t sistema-eventos:${{ github.sha }} -t sistema-eventos:latest .
          docker save sistema-eventos:latest -o sistema-eventos-image.tar

      - name: 5.3 Disponibilizar imagem Docker como artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-sistema-eventos
          path: sistema-eventos-image.tar
          retention-days: 7